[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayasr"
version = "0.1.0"
description = "Pause-aware live captions and WAV transcription powered by llama.cpp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "platformdirs>=4.12.4",
    "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/sitiyou/wayasr"
Issues = "https://github.com/sitiyou/wayasr/issues"

[project.optional-dependencies]
live = ["numpy>=1.24", "torch>=2.0", "torchaudio>=2.0", "silero-vad>=6.2", "onnxruntime>=1.16", "rich>=13"]

[dependency-groups]
dev = ["pytest>=8", "rich>=13"]

[project.scripts]
wayasr = "wayasr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
