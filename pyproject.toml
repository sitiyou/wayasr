[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayasr"
version = "0.1.0"
description = "Pause-aware live captions and WAV transcription powered by llama.cpp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beaupy>=4.0.1",
    "click>=8.1",
    "huggingface-hub>=0.24",
    "librosa>=0.11",
    "platformdirs>=4.12.4",
    "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/sitiyou/wayasr"
Issues = "https://github.com/sitiyou/wayasr/issues"

[project.optional-dependencies]
live = ["numpy>=1.24", "onnxruntime>=1.16", "rich>=13"]
wayland = [
    "asslayer>=0.1.0,<0.2.0 ; python_full_version >= '3.14' and sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8", "rich>=13"]

[project.scripts]
wayasr = "wayasr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
wayasr = ["data/*.onnx", "data/SILERO_LICENSE", "data/README.txt"]
